<div class="container mt-4">
    <!-- <h2 class="text-center mb-4 fw-bold">Latest Blogs</h2> -->
    <div class="row mb-4">
        <div class="col-12 text-center cent gap-3">
          <h1 class="section-title">Latest Blogs</h1>
          <p class="section-text col-md-10">
            From sustainable tips to exercise advice, we've got you covered.
          </p>
        </div>
      </div>
    <div class="row g-4 my-5">
        <div class="col-md-6 col-lg-4" *ngFor="let blog of blogs">
            
            <div class="card h-100 blog-card cursor-pointer" (click)="navigateToBlog(blog.slug)">
                <img [src]="blog.image" class="card-img-top" alt="Blog Image">
                <div class="card-body d-flex flex-column justify-content-between">
                    <h5 class="card-title">{{ blog.title }}</h5>
                    <p class="card-text">{{ blog.excerpt }}</p>
                    <!-- <button class="btn btn-dark mt-2" >
                        Read More
                    </button> -->
                </div>
            </div>
        </div>
    </div>
</div>
