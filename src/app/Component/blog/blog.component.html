<div class="position-relative  overflow-hidden ">
    <div class="container-fluid ">
        <div class="row align-items-center position-relative avh-100 align-items-center p-2 p-md-5">
            <!-- Text Section -->
            <div class="col-lg-7 col-md-12 text-center text-lg-start z-2 ">
                <div class="px-lg-5">
                    <!-- <p class=" mb-2 heading-1">{{headersSection.heading}}</p> -->
                    <h1 class="fw-bold display-6 heading-2">
                        Latest Blogs
                    </h1>
                    <p class=" mt-3 heading-3">
                        From sustainable tips to exercise advice, we've got you covered.
                    </p>
                    <button [routerLink]="['/product']" class="btn btn-dark mt-3 px-lg-5">Shop Now</button>
                </div>
            </div>

            <!-- Image Overlay Section -->
            <div class="col-lg-5 col-md-12">
                <div class="position-absolute top-0 start-0 w-100 h-100"
                    style="background: linear-gradient(270.02deg, rgba(255, 255, 255, 0) 22.8%, #FFFFFF 99.99%);z-index: 1;">
                </div>
                <!-- Desktop image (shown on tablets & desktops) -->
                <img src="assets/images/home-banner2.png" alt="Clothes"
                    class="img-fluid position-absolute top-50 end-0 translate-middle-y desktop-image d-none d-md-block w-100" />

                <!-- Mobile image (shown only on phones)
          <img src="assets/images/home-banner2.png" alt="Clothes" class="img-fluid mobile-image d-block d-md-none" /> -->

            </div>
        </div>
    </div>
</div>


<div class="container py-5">
    <!-- <h2 class="text-center mb-4 fw-bold">Latest Blogs</h2> -->
    <div class="row justify-content-center gy-4">
        <div class="col-12 " *ngFor="let blog of blogs">
            <div class="blog-entry d-flex flex-column flex-md-row align-items-start p-3 border-top bg-white h-100 cursor-pointer"
                (click)="navigateToBlog(blog.slug)">

                <img [src]="blog.image" alt="Blog Image" class="blog-img me-md-4 mb-3 mb-md-0" />

                <div class="flex-grow-1 d-flex flex-column justify-content-around h-100 " >
                    <h3 class=" display-6 fw-semibold mb-1">{{ blog.title }}</h3>
                    <!-- <div class="text-muted small mb-2">4 Min • {{ blog.date | date: 'MMMM d, y' }}</div> -->
                    <div class="text-muted small mb-2">4 Min • March 19, 2025</div>
                </div>
            </div>
        </div>
    </div>
</div>
