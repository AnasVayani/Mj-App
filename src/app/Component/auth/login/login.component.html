<div class="container-fluid login-container">
    <div class="row vh-100 ">
        <!-- Left Side - Logo -->
        <div class="col-md-6 col-lg-7 bg-black logo-container d-flex justify-content-center align-items-center">
           
                <img src="assets/logo-white.svg" alt="Logo" height="200" class="logo">
           

        </div>

        <!-- Right Side - Login Form -->
        <div class="col-md-6 col-lg-5 d-flex justify-content-md-start justify-content-center align-items-baseline align-items-md-center align-items-lg-center    ">
            <div class="form-box">
                <h2 class="fw-bold">Welcome 👋</h2>
                <p class="text-muted">Please login here</p>

                <!-- Login Form -->
                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                    <!-- Email Field -->
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" formControlName="email" class="form-control"
                            [class.is-invalid]="submitted && loginForm.controls['email'].invalid"
                            placeholder="Enter your email">
                        <div *ngIf="submitted && loginForm.controls['email'].invalid" class="invalid-feedback">
                            Email is required and must be valid.
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-3">
                        <!-- <label class="form-label">Password</label> -->
                        <div class="mb-3 position-relative">
                            <label class="form-label">Password</label>
                            <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
                                class="form-control password-input"
                                [class.is-invalid]="submitted && loginForm.controls['password'].invalid"
                                placeholder="Enter your password">
                            
                            <!-- Eye Icon (Toggle Password Visibility) -->
                            <i [class]="showPassword ? 'ri-eye-line password-toggle' : 'ri-eye-off-line password-toggle'" 
                               (click)="togglePassword()">
                            </i>
                        
                            <div *ngIf="submitted && loginForm.controls['password'].invalid" class="invalid-feedback">
                                Password must be at least 6 characters.
                            </div>
                        </div>
                        
                        
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <input type="checkbox" class="form-check-input" formControlName="rememberMe">
                            <label class="ms-1">Remember Me</label>
                        </div>
                        <a href="#" class="text-muted">Forgot Password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-dark py-2 w-100">Login</button>
                </form>
            </div>
        </div>
    </div>
</div>
