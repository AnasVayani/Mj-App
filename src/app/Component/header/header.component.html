<nav class="navbar">
  <div class="container">
    <!-- Logo -->
    <a routerLink="/" class="navbar-brand">
      <img src="./assets/logo.svg" alt="Krist Logo">
    </a>

    <!-- Hamburger Menu for Mobile -->
    <div class="menu-toggle" (click)="toggleMobileMenu()">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>

    <!-- Navbar Links -->
    <ul class="nav-links" [ngClass]="{ 'active': mobileMenuActive }">
      <li><a routerLink="/">Home</a></li>
      <li class="dropdown" (mouseenter)="toggleDropdown(true)" (mouseleave)="toggleDropdown(false)">
        <a class="dropbtn">Shop <i class="ri-arrow-down-s-line ri-lg"></i></a>
        <div class="dropdown-content" *ngIf="dropdownActive">

          <!-- Men Categories -->
          <div class="dropdown-column" *ngIf="menCategories.length > 0">
            <h4>Men</h4>
            <a *ngFor="let category of menCategories" [routerLink]="'/man/' + category.name.toLowerCase()">
              {{ category.name }}
            </a>
          </div>

          <!-- Women Categories -->
          <div class="dropdown-column" *ngIf="womenCategories.length > 0">
            <h4>Women</h4>
            <a *ngFor="let category of womenCategories" [routerLink]="'/woman/' + category.name.toLowerCase()">
              {{ category.name }}
            </a>
          </div>

        </div>
      </li>
      <li><a href="#">Our Story</a></li>
      <li><a href="#">Blog</a></li>
      <li><a href="#">Contact Us</a></li>
    </ul>

    <ul class="nav-links align-items-center gap-3">
      <li><i class="ri-search-2-line ri-lg"></i></li>
      <li><i class="ri-heart-line ri-lg"></i></li>
      <li><i class="ri-shopping-bag-3-line ri-lg"></i></li>
      <li><button type="button" class="btn btn-dark">Login</button></li>
    </ul>
  </div>
</nav>
