<div class="container mt-5">
    <h2 class="section-title">Related Products</h2>
    <div class="row justify-content-center">
        <div class="col-lg-3 col-md-4 col-sm-6 col-12" *ngFor="let product of relatedProducts">
            <div class="product-card">
                <img [src]="product.image" class="product-img img-fluid" alt="{{ product.title }}">
                <div class="product-info">
                    <h5 class="product-title">{{ product.title }}</h5>
                    <p class="product-subtitle">{{ product.subtitle }}</p>
                    <p class="price">
                        <span class="current-price me-2">${{ product.currentPrice }}</span>
                        <span class="old-price">${{ product.oldPrice }}</span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
